spring.application.name=api-calendario
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/calendariolaboral}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_CLAVE:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

festivos.url=${FESTIVOS_URL:http://localhost:3030/api/festivos}
festivos.timeout-conexion=${FESTIVOS_TIMEOUT_CONEXION:3s}
festivos.timeout-lectura=${FESTIVOS_TIMEOUT_LECTURA:10s}

springdoc.swagger-ui.path=/api-docs
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
